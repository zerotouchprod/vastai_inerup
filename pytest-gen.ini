[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v --tb=short --strict-markers --timeout=30
    --cov
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-fail-under=80

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require test video, slower)
    slow: Slow tests (ML processing, requires GPU)
    benchmark: Performance benchmark tests
    quality: Quality metric tests
    real_world: Tests using real downloaded videos

# Run all generation tests (copy-paste ready):
# python -m pytest -c pytest-gen.ini
#   tests/unit/test_gen_models.py tests/unit/test_gen_config.py
#   tests/unit/test_generation_result.py tests/unit/test_domain_generation.py
