name: Build worker image

on:
  workflow_dispatch:
    inputs:
      publish_runpod_pilot:
        description: Publish the public RIFE pilot image to GHCR (opt-in only)
        required: true
        type: boolean
        default: false
      cpu_image_e2e:
        description: Run exact immutable image + pod-args on a CPU runner through a temporary SSH tunnel (no RunPod)
        required: true
        type: boolean
        default: false
      worker_sha:
        description: Exact source commit at the selected workflow ref (must equal that commit)
        required: true
        type: string
        default: ""
  pull_request:
    branches: [ main ]
    paths:
      - 'src/worker/**'
      - 'src/application/orchestrator.py'
      - 'src/infrastructure/processors/rife/native.py'
      - 'src/infrastructure/processors/rife/native_wrapper.py'
      - 'src/shared/fps_planning.py'
      - 'tests/unit/test_worker.py'
      - 'tests/unit/test_worker_start.py'
      - 'tests/unit/test_bootstrap_reporting.py'
      - 'tests/unit/test_fps_planning.py'
      - 'tests/test_worker_image_contract.py'
      - 'contracts/worker-api-v1.json'
      - 'scripts/worker_image_acceptance.py'
      - 'scripts/build_worker.sh'
      - 'tests/test_runpod_*.py'
      - 'tests/unit/test_runpod_*.py'
      - 'docker/Dockerfile.worker'
      - 'docker/Dockerfile.worker.dockerignore'
      - 'docker/Dockerfile.runpod-pilot'
      - 'docker/Dockerfile.runpod-pilot.dockerignore'
      - 'requirements-worker.txt'
      - 'requirements-runpod-pilot.txt'
      - 'scripts/worker_start.sh'
      - 'scripts/cuda_runtime_preflight.py'
      - 'scripts/validate_rife_manifest.py'
      - 'scripts/runpod_checkpoint_bootstrap.py'
      - 'tests/unit/test_runpod_checkpoint_bootstrap.py'
      - 'scripts/runpod_pilot_controller.py'
      - 'scripts/runpod_pilot_test_control_plane.py'
      - 'ops/runpod-pilot/**'
      - 'tests/unit/test_runpod_pilot_controller.py'
      - 'tests/unit/test_runpod_pilot_controller_http.py'
      - 'tests/unit/test_runpod_pilot_controller_config.py'
      - 'tests/unit/test_runpod_pilot_alert_watch.py'
      - 'tests/unit/test_runpod_pilot_test_control_plane.py'
      - 'scripts/export_runpod_rife_bundle.py'
      - 'scripts/build_runpod_pilot_worker.sh'
      - 'runpod/pilot/**'
      - '.github/workflows/build-worker.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/worker/**'
      - 'src/application/orchestrator.py'
      - 'src/infrastructure/processors/rife/native.py'
      - 'src/infrastructure/processors/rife/native_wrapper.py'
      - 'src/shared/fps_planning.py'
      - 'tests/unit/test_worker.py'
      - 'tests/unit/test_worker_start.py'
      - 'tests/unit/test_bootstrap_reporting.py'
      - 'tests/unit/test_fps_planning.py'
      - 'tests/test_worker_image_contract.py'
      - 'contracts/worker-api-v1.json'
      - 'scripts/worker_image_acceptance.py'
      - 'scripts/build_worker.sh'
      - 'tests/test_runpod_*.py'
      - 'tests/unit/test_runpod_*.py'
      - 'docker/Dockerfile.worker'
      - 'docker/Dockerfile.worker.dockerignore'
      - 'docker/Dockerfile.runpod-pilot'
      - 'docker/Dockerfile.runpod-pilot.dockerignore'
      - 'requirements-worker.txt'
      - 'requirements-runpod-pilot.txt'
      - 'scripts/worker_start.sh'
      - 'scripts/cuda_runtime_preflight.py'
      - 'scripts/validate_rife_manifest.py'
      - 'scripts/runpod_checkpoint_bootstrap.py'
      - 'tests/unit/test_runpod_checkpoint_bootstrap.py'
      - 'scripts/runpod_pilot_controller.py'
      - 'scripts/runpod_pilot_test_control_plane.py'
      - 'ops/runpod-pilot/**'
      - 'tests/unit/test_runpod_pilot_controller.py'
      - 'tests/unit/test_runpod_pilot_controller_http.py'
      - 'tests/unit/test_runpod_pilot_controller_config.py'
      - 'tests/unit/test_runpod_pilot_alert_watch.py'
      - 'tests/unit/test_runpod_pilot_test_control_plane.py'
      - 'scripts/export_runpod_rife_bundle.py'
      - 'scripts/build_runpod_pilot_worker.sh'
      - 'runpod/pilot/**'
      - 'RIFEv4.26_0921/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test dependencies
        run: pip install pytest "numpy<2" "opencv-python-headless<5" requests pyyaml
      - name: Compile worker runtime and its pipeline dependencies
        run: >-
          python -m compileall -q
          src/worker src/application/orchestrator.py
          src/infrastructure/processors/rife/native.py
          src/infrastructure/processors/rife/native_wrapper.py
          src/shared/fps_planning.py
          scripts/validate_rife_manifest.py
          scripts/runpod_checkpoint_bootstrap.py
          scripts/runpod_pilot_controller.py
          scripts/runpod_pilot_test_control_plane.py
          ops/runpod-pilot/alert-watch.py
          ops/runpod-pilot/crash-loop-observer.py
          ops/runpod-pilot/docker-cpu-image-e2e.py
          ops/runpod-pilot/systemd-recovery-test.py
          ops/runpod-pilot/cpu-ssh-forward-e2e.py
      - name: Run worker, pilot contract, and model manifest tests
        run: >-
          python -m pytest
          tests/unit/test_worker.py tests/unit/test_worker_start.py
          tests/unit/test_bootstrap_reporting.py tests/unit/test_fps_planning.py
          tests/test_worker_image_contract.py tests/test_runpod_worker_image_contract.py
          tests/test_runpod_rife_volume.py tests/test_runpod_rife_code_volume.py
          tests/test_runpod_rife_timing.py
          tests/unit/test_runpod_model_manifest.py tests/unit/test_runpod_model_bundle.py
          tests/unit/test_runpod_checkpoint_bootstrap.py
          tests/unit/test_runpod_pilot_controller.py tests/unit/test_runpod_pilot_controller_http.py
          tests/unit/test_runpod_pilot_controller_config.py
          tests/unit/test_runpod_pilot_alert_watch.py
          tests/unit/test_runpod_pilot_crash_loop_observer.py
          tests/unit/test_runpod_pilot_docker_cpu_image_e2e.py
          tests/unit/test_runpod_pilot_test_control_plane.py -q
      - name: Run CPU-only worker image acceptance
        run: python scripts/worker_image_acceptance.py

  image:
    if: github.event_name != 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Existing worker image: PR builds only; main publishes after tests pass.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/zerotouchprod/aividup-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runpod-pilot-image:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true &&
      inputs.worker_sha == github.sha)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_sha || github.event.pull_request.head.sha || github.sha }}
      - name: Verify source SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.worker_sha || github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the model manifest
        id: manifest
        run: echo "sha256=$(sha256sum runpod/pilot/rife-v4.26/manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check for an existing anonymously pullable SHA-tag
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true
        env:
          IMAGE_REPO: zerotouchprod/aividup-worker-runpod-rife-pilot
          SOURCE_SHA: ${{ inputs.worker_sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          repo = os.environ['IMAGE_REPO']
          source_sha = os.environ['SOURCE_SHA']
          scope = urllib.parse.urlencode({'scope': f'repository:{repo}:pull'})
          token = json.load(urllib.request.urlopen(f'https://ghcr.io/token?{scope}', timeout=30))['token']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json',
          }
          request = urllib.request.Request(f'https://ghcr.io/v2/{repo}/manifests/{source_sha}', method='HEAD', headers=headers)
          try:
              response = urllib.request.urlopen(request, timeout=30)
              digest = response.headers.get('Docker-Content-Digest', '')
              if response.status != 200 or not digest.startswith('sha256:'):
                  raise RuntimeError('Existing image response lacked an immutable digest')
              exists = 'true'
          except urllib.error.HTTPError as error:
              if error.code not in (401, 404):
                  raise
              digest = ''
              exists = 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'exists={exists}\n')
              output.write(f'digest={digest}\n')
          print(f'public_sha_tag_exists={exists}; digest={digest or "(none)"}')
          PY
      - name: Build and optionally publish the pinned RIFE pilot image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runpod-pilot
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true }}
          load: ${{ github.event_name != 'workflow_dispatch' }}
          build-args: |
            GIT_SHA=${{ github.event_name == 'workflow_dispatch' && inputs.worker_sha || github.event.pull_request.head.sha || github.sha }}
            PIPELINE_VERSION=aividup-rife-interp-v1
            MODEL_MANIFEST_SHA256=${{ steps.manifest.outputs.sha256 }}
          tags: ghcr.io/zerotouchprod/aividup-worker-runpod-rife-pilot:${{ github.event_name == 'workflow_dispatch' && inputs.worker_sha || github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve immutable registry digest
        id: registry
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify anonymous registry digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true
        env:
          IMAGE_REPO: zerotouchprod/aividup-worker-runpod-rife-pilot
          SOURCE_SHA: ${{ inputs.worker_sha }}
          EXPECTED_DIGEST: ${{ steps.registry.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = os.environ['IMAGE_REPO']
          source_sha = os.environ['SOURCE_SHA']
          expected_digest = os.environ['EXPECTED_DIGEST']
          scope = urllib.parse.urlencode({'scope': f'repository:{repo}:pull'})
          token = json.load(urllib.request.urlopen(f'https://ghcr.io/token?{scope}', timeout=30))['token']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json',
          }
          request = urllib.request.Request(f'https://ghcr.io/v2/{repo}/manifests/{source_sha}', method='HEAD', headers=headers)
          response = urllib.request.urlopen(request, timeout=30)
          actual_digest = response.headers.get('Docker-Content-Digest', '')
          if response.status != 200 or actual_digest != expected_digest:
              raise SystemExit(f'Public manifest mismatch: expected={expected_digest}; actual={actual_digest}; status={response.status}')
          print(f'public_manifest_status={response.status}; digest={actual_digest}; source_sha={source_sha}')
          PY
      - name: Record immutable registry digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish_runpod_pilot == true
        env:
          IMAGE_DIGEST: ${{ steps.registry.outputs.digest }}
          SOURCE_SHA: ${{ inputs.worker_sha }}
        run: |
          printf 'Image: ghcr.io/zerotouchprod/aividup-worker-runpod-rife-pilot@%s\nSource SHA: %s\n' "$IMAGE_DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Report image byte size
        if: github.event_name != 'workflow_dispatch'
        run: docker image inspect --format='image_bytes={{.Size}}' ghcr.io/zerotouchprod/aividup-worker-runpod-rife-pilot:${{ github.event.pull_request.head.sha || github.sha }}

  runpod-pilot-cpu-image-e2e:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.cpu_image_e2e == true &&
      inputs.publish_runpod_pilot == false && inputs.worker_sha == github.sha
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.worker_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install ffmpeg and SSH key tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg openssh-client
      - name: Verify source and CPU Docker headroom
        env:
          EXPECTED_SHA: ${{ inputs.worker_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          import shutil
          free = shutil.disk_usage('/').free
          print(f'runner_root_free_bytes={free}')
          if free < 20_000_000_000:
              raise SystemExit('insufficient ephemeral runner disk for the 5.98GB compressed immutable image')
          PY
          docker info --format 'docker_server={{.ServerVersion}}'
      - name: Pull the published immutable image (no build or publish)
        run: docker pull ghcr.io/zerotouchprod/aividup-worker-runpod-rife-pilot@sha256:c775c62ade2d1851074751d761195aa6ace2895ed51af268b5f877535117475b
      - name: Run exact pod-args over a temporary restricted SSH tunnel on CPU
        run: >-
          python ops/runpod-pilot/docker-cpu-image-e2e.py
          --artifact-dir "${{ runner.temp }}/aividup-pilot-cpu-e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runpod-pilot-cpu-image-e2e
          path: ${{ runner.temp }}/aividup-pilot-cpu-e2e/
          if-no-files-found: warn
          retention-days: 7
