name: Build worker image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'docker/Dockerfile.worker'
      - 'requirements-worker.txt'
      - 'scripts/worker_start.sh'
      - 'RIFEv4.26_0921/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install pytest "numpy<2" opencv-python-headless requests pyyaml
      - run: python -m pytest tests/unit/test_worker.py tests/unit/test_worker_start.py tests/unit/test_fps_planning.py -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Dockerfile's import smoke test fails the build if worker dependencies are broken.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/zerotouchprod/aividup-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
