name: CI/CD - Video Processing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pylint mypy

    - name: Black formatting check
      run: black --check src/ tests/

    - name: Flake8 linting
      run: flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503

    - name: Pylint
      run: pylint src/ --disable=C0111,R0903 || true  # Don't fail on warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-benchmark

    - name: Run unit tests
      run: |
        pytest tests/test_audio_preservation.py \
               tests/test_roi_geometry.py \
               -v --cov=src --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libsm6 libxext6 libxrender-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark

    - name: Generate test videos
      run: |
        python tests/fixtures/generate_synthetic_videos.py

    - name: Run integration tests
      run: |
        pytest tests/test_integration_real_videos.py \
               -v -m "integration and not slow" \
               --tb=short

    - name: Archive test videos
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: test-videos
        path: tests/fixtures/videos/

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark

    - name: Generate test videos
      run: python tests/fixtures/generate_synthetic_videos.py

    - name: Run benchmarks
      run: |
        pytest tests/test_integration_real_videos.py \
               -v -m "benchmark" \
               --benchmark-only \
               --benchmark-json=benchmark.json

    - name: Store benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: benchmark.json

    - name: Compare benchmarks
      if: github.event_name == 'pull_request'
      run: |
        # TODO: Download baseline benchmarks and compare
        echo "Benchmark comparison (TODO)"

  quality-metrics:
    name: Quality Metrics Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest scikit-image

    - name: Run quality tests
      run: |
        pytest tests/test_integration_real_videos.py::TestQualityMetrics \
               -v -m "quality"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    if: always()

    steps:
    - name: Check build status
      run: |
        echo "Lint: ${{ needs.lint.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        
        if [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Build failed"
          exit 1
        else
          echo "✅ All checks passed"
        fi

