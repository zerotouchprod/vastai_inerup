name: Worker image slim candidate (python:3.11-slim, pinned)

# Separate candidate; never replaces the main aividup-worker tag and is not a staging/deploy target.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Also push to ghcr as aividup-worker:slim-candidate-<sha> (separate tag)"
        type: boolean
        default: false
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/Dockerfile.worker.python-base.experiment'
      - 'docker/Dockerfile.worker.python-base.experiment.dockerignore'
      - 'docker/locks/**'
      - 'scripts/registry_layer_report.py'
      - '.github/workflows/worker-image-slim-candidate.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      registry:
        image: registry:2
        ports: [ "5000:5000" ]
    env:
      DOCKERFILE: docker/Dockerfile.worker.python-base.experiment
      LOCAL: localhost:5000/aividup-worker-slim
    steps:
      - uses: actions/checkout@v7
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build 1 (push to local registry:2)
        run: |
          docker buildx build --platform linux/amd64 -f "$DOCKERFILE" \
            --build-arg GIT_SHA=${{ github.sha }} \
            --output type=image,name=$LOCAL:build1,push=true,registry.insecure=true .

      - name: Trivial code-only change
        run: echo "# slim-candidate layer-reuse probe" >> src/worker/__init__.py

      - name: Build 2 (same builder, normal cache, code-only change)
        run: |
          docker buildx build --platform linux/amd64 -f "$DOCKERFILE" \
            --build-arg GIT_SHA=${{ github.sha }} \
            --output type=image,name=$LOCAL:build2,push=true,registry.insecure=true .
          git checkout -- src/worker/__init__.py

      - name: Per-layer compressed sizes + layer reuse
        run: |
          mkdir -p evidence
          python3 scripts/registry_layer_report.py --repo aividup-worker-slim --tag build1 --tag build2 \
            --output evidence/slim-candidate-layers.json | tee evidence/slim-candidate-layers.txt

      - name: Versions inside image
        run: |
          docker pull $LOCAL:build1
          docker run --rm --entrypoint python $LOCAL:build1 -c "import sys, torch, torchvision, pip, setuptools; \
          print('python', sys.version.split()[0]); print('torch', torch.__version__, 'cuda', torch.version.cuda, 'cudnn', torch.backends.cudnn.version()); \
          print('torchvision', torchvision.__version__); print('pip', pip.__version__, 'setuptools', setuptools.__version__)" \
            | tee evidence/slim-candidate-versions.txt
          docker run --rm --entrypoint pip $LOCAL:build1 freeze --all > evidence/slim-candidate-pip-freeze.txt
          docker image inspect $LOCAL:build1 --format '{{.Size}}' > evidence/slim-candidate-uncompressed-bytes.txt

      - name: CPU passthrough acceptance
        run: |
          python3 scripts/worker_image_container_acceptance.py --image "$LOCAL:build1" --allow-local-tag \
            --evidence evidence/slim-candidate-acceptance.json

      - name: Publish separate candidate tag (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag $LOCAL:build1 ghcr.io/zerotouchprod/aividup-worker:slim-candidate-${{ github.sha }}
          docker push ghcr.io/zerotouchprod/aividup-worker:slim-candidate-${{ github.sha }} | tee evidence/slim-candidate-ghcr-push.txt

      - name: Summary
        if: always()
        run: |
          { echo '### Slim candidate'; echo '```'; cat evidence/slim-candidate-versions.txt evidence/slim-candidate-layers.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-slim-candidate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
