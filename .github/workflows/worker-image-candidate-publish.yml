name: Publish worker image candidate for OCI measurement

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-and-measure:
    name: Publish candidate and measure exact OCI digest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY_IMAGE: ghcr.io/zerotouchprod/aividup-worker
      BASELINE_IMAGE: ghcr.io/zerotouchprod/aividup-worker:2578d59dc0f8179aaea1cde434e6f1dfa2e746fb@sha256:f0bf12f71b4961c54de4b8e218ca75aa28ffdd32e1371cd1fb7aa120539279ef
      CANDIDATE_TAG: python-base-candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check runner disk before image pulls
        run: |
          mkdir -p evidence
          df -B1 / | tee evidence/disk-before.txt
          available="$(df -B1 --output=avail / | tail -n 1 | tr -d ' ')"
          test "$available" -ge $((20 * 1024 * 1024 * 1024))

      - name: Build and publish candidate tag
        run: |
          mkdir -p evidence
          docker buildx build \
            --platform linux/amd64 \
            --file docker/Dockerfile.worker.python-base.experiment \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "$REGISTRY_IMAGE:$CANDIDATE_TAG" \
            --push \
            --metadata-file evidence/build-metadata.json \
            .

      - name: Resolve immutable candidate digest
        id: resolve
        run: |
          digest="$(jq -r '."containerimage.digest"' evidence/build-metadata.json)"
          test "$digest" != "null"
          case "$digest" in
            sha256:*) ;;
            *) echo "Unexpected digest: $digest" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "candidate_image=$REGISTRY_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Pull exact candidate digest
        env:
          CANDIDATE_IMAGE: ${{ steps.resolve.outputs.candidate_image }}
        run: docker pull --platform linux/amd64 "$CANDIDATE_IMAGE"

      - name: Pull exact baseline digest
        run: docker pull --platform linux/amd64 "$BASELINE_IMAGE"

      - name: Record runner disk after image pulls
        run: df -B1 / | tee evidence/disk-after.txt

      - name: Compare published OCI manifest sizes
        env:
          CANDIDATE_IMAGE: ${{ steps.resolve.outputs.candidate_image }}
        run: |
          python3 scripts/worker_image_variant_report.py \
            --baseline "$BASELINE_IMAGE" \
            --candidate "$CANDIDATE_IMAGE" \
            --output evidence/published-oci-comparison.json

      - name: Run exact candidate CPU passthrough acceptance
        env:
          CANDIDATE_IMAGE: ${{ steps.resolve.outputs.candidate_image }}
        run: |
          python3 scripts/worker_image_container_acceptance.py \
            --image "$CANDIDATE_IMAGE" \
            --evidence evidence/published-candidate-acceptance.json

      - name: Write candidate summary
        env:
          CANDIDATE_IMAGE: ${{ steps.resolve.outputs.candidate_image }}
          CANDIDATE_DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          {
            echo "# Published Python-base candidate"
            echo ""
            echo "- Image: \`$CANDIDATE_IMAGE\`"
            echo "- Digest: \`$CANDIDATE_DIGEST\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Production default: NO — experiment only"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OCI and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-worker-candidate-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
