name: Publish slim worker candidate (manual, separate tag)

# Manual only. Builds docker/Dockerfile.worker.python-base.experiment at an explicit commit and pushes
# ONLY ghcr.io/zerotouchprod/aividup-worker:slim-candidate-<sha>. Never touches the main worker tag,
# staging worker digest, or any deploy config. GPU smoke (RIFE + RealESRGAN) on the recorded digest is
# still required before any assignment.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-char commit SHA to build (must contain the slim Dockerfile + docker/locks)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: slim-candidate-publish-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHA: ${{ inputs.commit_sha }}
      IMAGE: ghcr.io/zerotouchprod/aividup-worker
      DOCKERFILE: docker/Dockerfile.worker.python-base.experiment
    steps:
      - name: Validate input
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full lowercase 40-char SHA"; exit 1; }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Verify checked-out commit and inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test -f "$DOCKERFILE"
          ls docker/locks/*.lock
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing candidate tag
        run: |
          if docker buildx imagetools inspect "$IMAGE:slim-candidate-$SHA" >/dev/null 2>&1; then
            echo "Tag slim-candidate-$SHA already exists; not overwriting."; exit 1
          fi
      - name: Build and push slim-candidate tag only
        run: |
          mkdir -p evidence
          docker buildx build --platform linux/amd64 -f "$DOCKERFILE" \
            --build-arg GIT_SHA="$SHA" \
            --tag "$IMAGE:slim-candidate-$SHA" \
            --metadata-file evidence/build-metadata.json \
            --push .
      - name: Record OCI digests and layer sizes
        run: |
          REF="$IMAGE:slim-candidate-$SHA"
          docker buildx imagetools inspect "$REF" --raw > evidence/index-or-manifest.json
          docker buildx imagetools inspect "$REF" > evidence/imagetools.txt
          python3 - "$REF" <<'PY'
          import json, subprocess, sys
          ref = sys.argv[1]
          meta = json.load(open("evidence/build-metadata.json"))
          top = meta.get("containerimage.digest")
          raw = json.load(open("evidence/index-or-manifest.json"))
          amd64 = top
          if "manifests" in raw:
              amd64 = [m for m in raw["manifests"] if m.get("platform", {}).get("architecture") == "amd64"][0]["digest"]
          man = json.loads(subprocess.check_output(["docker", "buildx", "imagetools", "inspect", f"{ref.rsplit(':',1)[0]}@{amd64}", "--raw"]))
          layers = [l["size"] for l in man["layers"]]
          out = {"ref": ref, "digest": top, "amd64_manifest_digest": amd64, "pinned_ref": f"{ref.rsplit(':',1)[0]}@{top}",
                 "layer_count": len(layers), "total_compressed_bytes": sum(layers), "layer_sizes": layers}
          json.dump(out, open("evidence/slim-candidate-digest.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Run summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("evidence/slim-candidate-digest.json"))
          print("### Slim worker candidate published (NOT staging)")
          print(f"- Tag: `{d['ref']}`")
          print(f"- Digest: `{d['digest']}` (amd64 manifest `{d['amd64_manifest_digest']}`)")
          print(f"- Pinned ref: `{d['pinned_ref']}`")
          print(f"- Layers: {d['layer_count']}, compressed: {d['total_compressed_bytes']:,} bytes")
          print("- Required before use: GPU smoke of RIFE + RealESRGAN on this exact digest.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slim-candidate-publish-${{ inputs.commit_sha }}
          path: evidence/
