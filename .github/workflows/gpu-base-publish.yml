name: Publish gpu-base (manual, immutable tag)

# Manual only. Builds docker/Dockerfile.gpu-base at an explicit commit and pushes
# ONLY ghcr.io/zerotouchprod/aividup-gpu-base:<sha>. Never touches worker tags, staging, or deploy config.
# Workers must reference the recorded @sha256 digest, not the tag.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-char commit SHA to build (must contain docker/Dockerfile.gpu-base + docker/locks)"
        required: true
        type: string

# Top-level: no write scopes. packages:write is granted only to the publish job.
permissions:
  contents: read

# Serialize ALL publishes (not per SHA) so two runs can't race on tags.
concurrency:
  group: gpu-base-publish
  cancel-in-progress: false

env:
  ALLOWED_BRANCH: gpu-base-arch
  ALLOWED_PR: "24"

jobs:
  verify-sha:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SHA: ${{ inputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate format
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full lowercase 40-char SHA"; exit 1; }
      - name: SHA must be on gpu-base-arch (head or ancestor) or a commit of PR #24
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          status=$(gh api "repos/$R/compare/$SHA...$ALLOWED_BRANCH" --jq .status 2>/dev/null || echo error)
          echo "compare $SHA...$ALLOWED_BRANCH: $status"
          if [[ "$status" == "identical" || "$status" == "ahead" ]]; then echo "OK: on $ALLOWED_BRANCH"; exit 0; fi
          if gh api --paginate "repos/$R/pulls/$ALLOWED_PR/commits" --jq '.[].sha' | grep -qx "$SHA"; then
            echo "OK: commit of PR #$ALLOWED_PR"; exit 0
          fi
          echo "REFUSED: $SHA is not on $ALLOWED_BRANCH and not a PR #$ALLOWED_PR commit"; exit 1

  publish:
    needs: verify-sha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Protected environment: requires manual approval by a required reviewer before this job starts.
    environment: gpu-base-publish
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ inputs.commit_sha }}
      IMAGE: ghcr.io/zerotouchprod/aividup-gpu-base
      REPO_PATH: zerotouchprod/aividup-gpu-base
      DOCKERFILE: docker/Dockerfile.gpu-base
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Verify checked-out commit and inputs
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          test -f "$DOCKERFILE"
          ls docker/locks/*.lock
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing candidate tag (fail-closed)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RT=$(curl -fsS -u "${{ github.actor }}:$TOKEN" "https://ghcr.io/token?service=ghcr.io&scope=repository:$REPO_PATH:pull" | jq -r .token)
          [ -n "$RT" ] && [ "$RT" != null ] || { echo "Could not obtain registry token; failing closed"; exit 1; }
          echo "$RT" > "$RUNNER_TEMP/rt"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer $RT" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$REPO_PATH/manifests/$SHA")
          echo "HEAD manifests/$SHA -> HTTP $code"
          case "$code" in
            404) echo "Tag absent; proceeding." ;;
            200) echo "Tag $SHA already exists; not overwriting."; exit 1 ;;
            *)   echo "Unexpected status $code; failing closed."; exit 1 ;;
          esac
      - name: Build and push gpu-base:<sha> tag only
        run: |
          mkdir -p evidence
          docker buildx build --platform linux/amd64 -f "$DOCKERFILE" \
            --provenance=false \
            --tag "$IMAGE:$SHA" \
            --metadata-file evidence/build-metadata.json \
            --push .
      - name: Post-push check (detects a racing overwrite; check+push is not atomic)
        run: |
          set -euo pipefail
          built=$(jq -r '."containerimage.digest"' evidence/build-metadata.json)
          now=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "built=$built tag_now=$now"
          [ "$built" = "$now" ] || { echo "Tag digest differs from what this run pushed; treat tag as untrusted, use the digest below."; exit 1; }
      - name: Record OCI digests and layer sizes
        run: |
          REF="$IMAGE:$SHA"
          docker buildx imagetools inspect "$REF" --raw > evidence/index-or-manifest.json
          docker buildx imagetools inspect "$REF" > evidence/imagetools.txt
          python3 - "$REF" <<'PY'
          import json, subprocess, sys
          ref = sys.argv[1]
          meta = json.load(open("evidence/build-metadata.json"))
          top = meta.get("containerimage.digest")
          raw = json.load(open("evidence/index-or-manifest.json"))
          amd64 = top
          if "manifests" in raw:
              amd64 = [m for m in raw["manifests"] if m.get("platform", {}).get("architecture") == "amd64"][0]["digest"]
          man = json.loads(subprocess.check_output(["docker", "buildx", "imagetools", "inspect", f"{ref.rsplit(':',1)[0]}@{amd64}", "--raw"]))
          layers = [l["size"] for l in man["layers"]]
          out = {"ref": ref, "digest": top, "amd64_manifest_digest": amd64, "pinned_ref": f"{ref.rsplit(':',1)[0]}@{top}",
                 "layer_count": len(layers), "total_compressed_bytes": sum(layers), "layer_sizes": layers}
          json.dump(out, open("evidence/gpu-base-digest.json", "w"), indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Run summary
        run: |
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          d = json.load(open("evidence/gpu-base-digest.json"))
          print("### gpu-base published (NOT staging)")
          print(f"- Tag: `{d['ref']}`")
          print(f"- Digest: `{d['digest']}` (amd64 manifest `{d['amd64_manifest_digest']}`)")
          print(f"- Pinned ref: `{d['pinned_ref']}`")
          print(f"- Layers: {d['layer_count']}, compressed: {d['total_compressed_bytes']:,} bytes")
          print("- Use the immutable pinned ref (digest), never the tag, for any downstream step.")
          print("- Required before use: GPU smoke of a worker built FROM this digest.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-base-publish-${{ inputs.commit_sha }}
          path: evidence/
