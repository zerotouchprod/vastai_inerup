name: Publish Blackwell Serverless experiment image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH_BLACKWELL_SERVERLESS to authorize experimental GHCR publication
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish experimental image only
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: inputs.confirm == 'PUBLISH_BLACKWELL_SERVERLESS'
    env:
      IMAGE: ghcr.io/zerotouchprod/vastai_inerup
      TAG: blackwell-serverless-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse overwrite of immutable experimental tag
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/v2/zerotouchprod/vastai_inerup/manifests/$TAG")
          case "$code" in
            404) ;;
            200) echo "Tag already exists; refusing overwrite."; exit 1 ;;
            *) echo "Unexpected registry response: $code"; exit 1 ;;
          esac

      - name: Build and push experimental tag
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker buildx build \
            --platform linux/amd64 \
            --progress=plain \
            --file docker/Dockerfile.aividup-serverless \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --tag "$IMAGE:$TAG" \
            --metadata-file evidence/build-metadata.json \
            --push . 2>&1 | tee evidence/docker-publish.log

      - name: Verify and record immutable digest
        run: |
          set -euo pipefail
          digest=$(jq -r '."containerimage.digest"' evidence/build-metadata.json)
          case "$digest" in sha256:*) ;; *) exit 1 ;; esac
          registry_digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
          test "$digest" = "$registry_digest"
          printf '%s\n' "$digest" > evidence/blackwell-serverless-digest.txt
          printf '%s@%s\n' "$IMAGE" "$digest" > evidence/blackwell-serverless-image.txt
          cat evidence/blackwell-serverless-image.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackwell-serverless-publish-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
