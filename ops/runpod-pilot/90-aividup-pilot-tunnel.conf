# Dedicated pilot SSH principal: outbound local-forward only, no arbitrary shell or remote forward.
Match User aividup-pilot-tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8099
    PermitTTY no
    AllowAgentForwarding no
    X11Forwarding no
    ForceCommand /usr/sbin/nologin
Match all
