[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers

# Markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require test video, slower)
    slow: Slow tests (ML processing, requires GPU)
    benchmark: Performance benchmark tests (Sprint 2)
    quality: Quality metric tests - PSNR, SSIM (Sprint 2)
    real_world: Tests using real downloaded videos (Sprint 2)

# Usage examples:
# pytest -m unit              # Run only unit tests
# pytest -m integration       # Run only integration tests
# pytest -m "not slow"        # Skip slow tests (ML)
# pytest -m benchmark         # Run performance benchmarks
# pytest -m quality           # Run quality metric tests
# pytest tests/test_audio_preservation.py  # Sprint 1 tests
# pytest tests/test_integration_real_videos.py  # Sprint 2 tests


