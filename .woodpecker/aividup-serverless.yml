# aividup-serverless-blackwell experiment image. Separate from worker.yml; never deploys anything.
# Builds :cu128-<sha> (target) and :cu126-<sha> (same image on the prod torch wheel, for A/B tracebacks).
when:
  - event: push
    branch: feat/aividup-serverless-blackwell
steps:
  - name: build-cu128
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_USERNAME: {from_secret: ghcr_username}
      GHCR_TOKEN: {from_secret: ghcr_token}
    commands:
      - mkdir -p /kaniko/.docker
      - printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --context=dir://$CI_WORKSPACE --dockerfile=docker/Dockerfile.aividup-serverless
        --build-arg=GIT_SHA=$CI_COMMIT_SHA
        --destination=ghcr.io/zerotouchprod/aividup-serverless-blackwell:cu128-$CI_COMMIT_SHA --digest-file=/tmp/digest
        --snapshot-mode=redo --use-new-run --compressed-caching=false --cleanup
      - 'echo "IMAGE_DIGEST_CU128=$(cat /tmp/digest)"'
  - name: build-cu126-ab
    image: gcr.io/kaniko-project/executor:debug
    environment:
      GHCR_USERNAME: {from_secret: ghcr_username}
      GHCR_TOKEN: {from_secret: ghcr_token}
    commands:
      - mkdir -p /kaniko/.docker
      - printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --context=dir://$CI_WORKSPACE --dockerfile=docker/Dockerfile.aividup-serverless
        --build-arg=GIT_SHA=$CI_COMMIT_SHA --build-arg=CUDA_BASE=nvidia/cuda:12.6.0-cudnn-runtime-ubuntu22.04
        --build-arg=TORCH_INDEX=cu126
        --destination=ghcr.io/zerotouchprod/aividup-serverless-blackwell:cu126-$CI_COMMIT_SHA --digest-file=/tmp/digest
        --snapshot-mode=redo --use-new-run --compressed-caching=false --cleanup
      - 'echo "IMAGE_DIGEST_CU126=$(cat /tmp/digest)"'
